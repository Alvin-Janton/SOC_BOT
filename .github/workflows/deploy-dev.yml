name: Deploy Dev Infrastructure

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: soc-bot-dev-data
  cancel-in-progress: false

jobs:
  deploy-data:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_REGION: us-east-1
      AWS_PAGER: ""
      DEV_ALLOWED_CLIENT_CIDR: ${{ vars.DEV_ALLOWED_CLIENT_CIDR }}
      DEV_FRONTEND_ALLOWED_CLIENT_CIDR: ${{ vars.DEV_FRONTEND_ALLOWED_CLIENT_CIDR }}
      DEV_GOOGLE_LOGIN_ENABLED: ${{ vars.DEV_GOOGLE_LOGIN_ENABLED }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate dev deployment role
        id: expected
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${AWS_ROLE_ARN}" =~ ^arn:aws:iam::([0-9]{12}):role/SOC_BOT_DEV_DEPLOY$ ]]; then
            echo '::error::The dev AWS_ROLE_ARN must identify SOC_BOT_DEV_DEPLOY.'
            exit 1
          fi
          echo "account=${BASH_REMATCH[1]}" >> "${GITHUB_OUTPUT}"
          echo "CDK_DEFAULT_ACCOUNT=${BASH_REMATCH[1]}" >> "${GITHUB_ENV}"
          if [[ -z "${DEV_ALLOWED_CLIENT_CIDR}" ]]; then
            echo '::error::Set the dev Environment variable DEV_ALLOWED_CLIENT_CIDR before deployment.'
            exit 1
          fi

          if [[ -z "${DEV_FRONTEND_ALLOWED_CLIENT_CIDR}" ]]; then
            echo '::error::Set the dev Environment variable DEV_FRONTEND_ALLOWED_CLIENT_CIDR before deployment.'
            exit 1
          fi
          case "${DEV_GOOGLE_LOGIN_ENABLED}" in
            ''|false) echo 'DEV_GOOGLE_LOGIN_ENABLED=false' >> "${GITHUB_ENV}" ;;
            true) ;;
            *) echo '::error::DEV_GOOGLE_LOGIN_ENABLED must be true or false.'; exit 1 ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint TypeScript
        run: npm run lint

      - name: Compile infrastructure
        run: npm run build

      - name: Synthesize infrastructure and run cdk-nag
        run: npm run synth --workspace @soc-bot/infra -- -c "devAllowedClientCidr=${DEV_ALLOWED_CLIENT_CIDR}" -c "devFrontendAllowedClientCidr=${DEV_FRONTEND_ALLOWED_CLIENT_CIDR}" -c "devGoogleLoginEnabled=${DEV_GOOGLE_LOGIN_ENABLED}"

      - name: Assume dev deployment role through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com
          allowed-account-ids: ${{ steps.expected.outputs.account }}
          role-session-name: soc-bot-dev-deploy-${{ github.run_id }}
          role-duration-seconds: 3600
          unset-current-credentials: true
          retry-max-attempts: 2

      - name: Deploy only the dev Data, AI and Frontend stacks
        env:
          EXEC_ROLE_ARN: arn:aws:iam::${{ steps.expected.outputs.account }}:role/SOC_BOT_DEV_CFN_EXEC
        run: |
          ./node_modules/.bin/cdk deploy devDataStack devAiStack devFrontendStack \
            --app infra/cdk.out \
            --role-arn "${EXEC_ROLE_ARN}" \
            --require-approval never \
            --exclusively \
            --ci
